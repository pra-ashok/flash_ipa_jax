name: CPU correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            jax: '0.7.1'
          - python: '3.12'
            jax: '0.11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "jax[cpu]==${{ matrix.jax }}" ".[test]"
      - run: python -m pytest -q
      - run: python examples/minimal.py
      - run: python examples/train.py --backend native --steps 3 --length 8
      - run: python benchmarks/benchmark.py --backend native --lengths 16 --repeats 2
