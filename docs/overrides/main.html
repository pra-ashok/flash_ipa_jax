{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <script>
    // Apply the saved preference before painting the page.
    try {
      const saved = localStorage.getItem("flash-ipa-theme");
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    } catch (_) {}
  </script>
{% endblock %}

{% block site_name %}
  <a class="skip-link" href="#{{ 'main-content' if page else 'search' }}">Skip to content</a>
  <a class="project-brand" href="{{ nav.homepage.url|url }}">
    <span class="project-mark" aria-hidden="true">IPA</span>
    <span>{{ config.site_name }}<small>Geometry-aware attention</small></span>
  </a>
{% endblock %}

{% block mobile_nav %}
  <button class="mobile-menu-toggle" type="button" data-toggle="wy-nav-top"
          aria-label="Toggle documentation navigation">&#9776;</button>
  <a href="{{ nav.homepage.url|url }}">{{ config.site_name }}</a>
{% endblock %}

{% block content %}
  <div id="main-content" tabindex="-1">{{ page.content }}</div>
{% endblock %}
